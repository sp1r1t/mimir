services:
  mimir:
    build: .
    image: mimir:latest
    container_name: mimir
    restart: unless-stopped
    env_file: .env
    environment:
      MIMIR_DATA_DIR: /data
      MIMIR_PORT: "8080"
    ports:
      - "${MIMIR_PUBLISH:-127.0.0.1:8470}:8080"
    volumes:
      - ./data:/data
    # Allow in-flight fetches and classifications to finish on shutdown.
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
